<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WPS 加载项安装器</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">WPS OFFLINE ADDON</p>
        <h1>日期选择器安装器</h1>
        <p class="subtle">离线安装、修复或卸载 WPS 表格日期选择器。</p>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-heading">
          <div>
            <p class="label">当前状态</p>
            <h2 id="status-title">正在检查环境…</h2>
          </div>
          <span id="status-badge" class="badge checking">检查中</span>
        </div>
        <dl id="environment-details" class="details"></dl>
      </section>

      <p id="operation-message" class="operation-message" role="status"></p>

      <section id="operation-progress" class="operation-progress" aria-live="polite" hidden>
        <div class="progress-heading">
          <span id="progress-message">正在准备…</span>
          <span id="progress-percent">0%</span>
        </div>
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="操作进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>


      <section class="actions" aria-label="加载项操作">
        <button id="install-button" class="primary" type="button">
          <span class="button-spinner" aria-hidden="true"></span>
          <span class="button-label">安装 / 修复</span>
        </button>
        <button id="uninstall-button" class="secondary" type="button">
          <span class="button-spinner" aria-hidden="true"></span>
          <span class="button-label">卸载</span>
        </button>
      </section>

      <section class="help">
        <p>安装或卸载完成后会重启 WPS；请先保存正在编辑的文档。</p>
        <div class="meta-row">
          <span id="app-version" class="app-version"></span>
          <button id="check-update-link" class="link-button" type="button">检查更新</button>
          <span class="meta-sep" aria-hidden="true">·</span>
          <button id="copy-diagnostics" class="link-button" type="button">复制诊断信息</button>
        </div>
      </section>
    </main>

    <div id="update-toast" class="update-toast" role="alert" hidden>
      <div class="toast-body">
        <p id="toast-title" class="toast-title"></p>
        <p id="toast-notes" class="toast-notes" hidden></p>
        <div id="toast-progress" class="toast-progress" role="progressbar" aria-label="更新下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <div id="toast-progress-bar"></div>
        </div>
      </div>
      <div class="toast-actions">
        <button id="toast-action" class="toast-action" type="button">立即更新</button>
        <button id="toast-dismiss" class="toast-dismiss" type="button" aria-label="关闭">&times;</button>
      </div>
    </div>

    <div id="confirmation-dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirmation-title" hidden>
      <section class="confirmation-dialog">
        <p class="dialog-eyebrow">请确认操作</p>
        <h2 id="confirmation-title">继续操作？</h2>
        <p id="confirmation-message" class="confirmation-message"></p>
        <div class="confirmation-actions">
          <button id="confirmation-cancel" class="secondary" type="button">取消</button>
          <button id="confirmation-confirm" class="primary" type="button">继续</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
