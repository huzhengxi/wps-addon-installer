[package]
name = "wps-addon-installer"
version = "0.1.0"
description = "Offline installer for the WPS date-picker addon"
authors = ["Liqiong"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "wps_addon_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wps-addon-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
hex = "0.4.3"
sevenz-rust = "0.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-updater = "2.9.0"
tempfile = "3.23.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23.0"
