[package]
name = "wps-addon-manager"
version = "0.1.0"
description = "WPS Office ET add-on manager with trusted control sources, secure installation and removal"
keywords = ["wps", "wps-office", "addon", "plugin-manager", "tauri"]
categories = ["gui"]
authors = ["Liqiong"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "wps_addon_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wps-addon-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
hex = "0.4.3"
sevenz-rust = "0.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10.9"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-updater = "2.9.0"
tempfile = "3.23.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23.0"
