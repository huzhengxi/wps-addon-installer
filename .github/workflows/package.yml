name: Package desktop app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows
          - linux
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # macOS produces a portable .app bundle (resources embedded inside the
  # .app) and is zipped directly. Both arm64 and x64 build on macos-15.
  package-macos-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos-arm64'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:zip -- --target aarch64-apple-darwin
      - name: Locate zip
        id: asset
        shell: bash
        run: |
          zip=$(find src-tauri/target -name "wps-addon-installer_*_arm64.zip" -type f | head -n1)
          [ -n "$zip" ] || { echo "macOS arm64 zip not found"; exit 1; }
          echo "path=$zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-macos-arm64
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${{ steps.asset.outputs.path }}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${{ steps.asset.outputs.path }}"

  package-macos-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos-x64'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:zip -- --target x86_64-apple-darwin
      - name: Locate zip
        id: asset
        shell: bash
        run: |
          zip=$(find src-tauri/target -name "wps-addon-installer_*_x64.zip" -type f | head -n1)
          [ -n "$zip" ] || { echo "macOS x64 zip not found"; exit 1; }
          echo "path=$zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-macos-x64
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${{ steps.asset.outputs.path }}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${{ steps.asset.outputs.path }}"

  # Windows has no portable executable bundle (Tauri only offers msi/nsis),
  # so fall back to the nsis installer and ship it at the zip root.
  package-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:windows
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package installer into zip
        id: asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found"; exit 1 }
          $zip = "wps-addon-installer_${{ steps.ver.outputs.version }}_x64.zip"
          Compress-Archive -Path $installer.FullName -DestinationPath $zip
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$zip"
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-windows-x64
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${{ steps.asset.outputs.path }}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${{ steps.asset.outputs.path }}"

  # Linux ships a portable AppImage (single self-contained executable).
  package-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev zip
      - run: npm ci
      - run: npm run check
      - run: npm run package:linux
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package AppImage into zip
        id: asset
        shell: bash
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -n1)
          [ -n "$appimage" ] || { echo "AppImage not found"; exit 1; }
          zip="wps-addon-installer_${{ steps.ver.outputs.version }}_x64.zip"
          zip -j "$zip" "$appimage"
          echo "path=$zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-linux-x64
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${{ steps.asset.outputs.path }}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${{ steps.asset.outputs.path }}"
