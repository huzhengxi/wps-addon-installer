name: Package desktop app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:macos
      - run: npm run package:zip
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-macos-arm64
          path: |
            src-tauri/target/**/bundle/dmg/**
            src-tauri/target/**/bundle/macos/**
          if-no-files-found: error

  package-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    # WiX 3 MSI validation requires the Windows VBScript optional feature.
    # Pin the image because windows-latest can move to images without it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Enable VBScript for WiX MSI validation
        shell: pwsh
        run: |
          dism.exe /Online /Enable-Feature /FeatureName:VBSCRIPT /NoRestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm run check
      - run: npm run package:windows
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-windows-x64
          path: |
            src-tauri/target/**/bundle/msi/**
            src-tauri/target/**/bundle/nsis/**
          if-no-files-found: error

  package-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run check
      - run: npm run package:linux
      - uses: actions/upload-artifact@v6
        with:
          name: wps-addon-installer-linux-x64
          path: |
            src-tauri/target/**/bundle/appimage/**
            src-tauri/target/**/bundle/deb/**
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-windows, package-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v7
        with:
          name: wps-addon-installer-macos-arm64
          path: release-assets/macos
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: wps-addon-installer-windows-x64
          path: release-assets/windows
      - name: Download Linux package
        uses: actions/download-artifact@v7
        with:
          name: wps-addon-installer-linux-x64
          path: release-assets/linux
      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
          fi
